name: Build MulkCare APK

on:
  workflow_dispatch:
  push:
    branches: [ 'feature/flutter-migration-v3', 'feature/mvp-**' ]
    paths-ignore:
      - '.agent/**'
      - '**/*.md'
      - 'src/**'
      - 'public/**'
      - 'cdn-assets/**'

permissions:
  contents: write

concurrency:
  group: mulkcare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Toolchain
        run: flutter --version 2>&1 | tee toolchain.txt

      - name: Generate android/ scaffold and guard applicationId
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com --project-name mullky .
          fi
          rm -f test/widget_test.dart
          f=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -1)
          grep -n 'applicationId' "$f"
          grep -Eq 'applicationId[ =]*"com\.mullky"' "$f"
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' "$M"
          sed -i 's/android:label="mullky"/android:label="MulkCare"/' "$M"

      - run: flutter pub get

      - name: Screenshots (evidence only, never blocks)
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test test_shots/shots_test.dart 2>&1 | tee shots_log.txt

      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls build/shots/*.png >/dev/null 2>&1 || { echo "no shots"; tail -n 200 shots_log.txt > shots_log_tail.txt || true; gh release create "shots-fail-${{ github.run_number }}" shots_log_tail.txt --prerelease --target "${{ github.sha }}" --title "Shots FAILED #${{ github.run_number }}" --notes "no screenshots produced" || true; exit 0; }
          { grep -n 'ICONFONT\|EXCEPTION before' shots_log.txt | head; awk '/EXCEPTION CAUGHT/{f=1} f' shots_log.txt | head -170; } > shots_log_tail.txt || true; gh release create "shots-${{ github.run_number }}" build/shots/*.png shots_log_tail.txt --prerelease --target "${{ github.sha }}" --title "Screenshots #${{ github.run_number }}" --notes "Rendered by flutter test with real Tajawal font at 390x844. Evidence of layout only; NOT a device."

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee build_log.txt

      - name: Test
        timeout-minutes: 12
        run: |
          set -o pipefail
          flutter test --timeout 60s --reporter expanded 2>&1 | tee -a build_log.txt

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee -a build_log.txt

      - name: Release APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" build/app/outputs/flutter-apk/app-release.apk --prerelease --target "${{ github.sha }}" --title "MulkCare APK build #${{ github.run_number }}" --notes "Commit ${{ github.sha }} (${{ github.ref_name }}). NOT device-tested. Debug-key signed.

          $(cat toolchain.txt)"

      - name: Failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { grep -n '\[E\]\|Some tests failed\|timed out\|EXCEPTION' build_log.txt | head -40; echo '----- tail -----'; tail -n 300 build_log.txt; } > build_log_tail.txt || echo "no log" > build_log_tail.txt
          gh release create "debug-${{ github.run_number }}" build_log_tail.txt --prerelease --target "${{ github.sha }}" --title "FAILED log #${{ github.run_number }}" --notes "commit ${{ github.sha }}"
