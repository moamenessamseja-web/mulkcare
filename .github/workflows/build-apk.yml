name: Build MulkCare APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/flutter-migration-complete
    paths-ignore:
      - '.agent/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: mulkcare-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Analyze, test, and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Install pinned Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Record toolchain
        run: flutter --version | tee toolchain.txt

      - name: Generate Android platform scaffold in CI
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com --project-name mullky .
          fi
          rm -f test/widget_test.dart
          app_gradle=$(find android/app -maxdepth 1 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) | head -n 1)
          echo "Checking Android application ID in ${app_gradle}"
          grep -n 'applicationId' "$app_gradle"
          grep -Eq 'applicationId[ =]*"com\.mullky"' "$app_gradle"
          manifest=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="mullky"/android:label="MulkCare"/' "$manifest"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Upload resolved dependency lock
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MulkCare-pubspec-lock-${{ github.run_number }}
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 14

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MulkCare-APK-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MulkCare-build-diagnostics-${{ github.run_number }}
          path: |
            toolchain.txt
            build/**/outputs/**/logs/**
          if-no-files-found: ignore
          retention-days: 7
